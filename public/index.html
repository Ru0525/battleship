<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海戰棋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#1a1f2e;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:900px;padding:1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2d3748}
h1{font-size:1.2rem;font-weight:600;color:#90cdf4;letter-spacing:1px}
.room-info{font-size:12px;color:#718096;background:#2d3748;padding:4px 12px;border-radius:20px}
.screen{display:none;width:100%;max-width:900px;padding:1rem}
.screen.active{display:block}

/* lobby */
.lobby-card{background:#2d3748;border-radius:12px;padding:2rem;text-align:center;max-width:400px;margin:4rem auto}
.lobby-card h2{font-size:1.4rem;margin-bottom:8px;color:#90cdf4}
.lobby-card p{font-size:14px;color:#a0aec0;margin-bottom:1.5rem}
.input-row{display:flex;gap:8px;justify-content:center;margin-bottom:1rem}
input[type=text]{background:#1a1f2e;border:1px solid #4a5568;border-radius:8px;padding:8px 14px;color:#e2e8f0;font-size:14px;width:140px;text-align:center;text-transform:uppercase}
input[type=text]::placeholder{text-transform:none;color:#718096}
button{background:#3182ce;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:14px;cursor:pointer;transition:background 0.15s}
button:hover{background:#2b6cb0}
button.sec{background:#2d3748;border:1px solid #4a5568;color:#a0aec0}
button.sec:hover{background:#4a5568}
button.danger{background:#c53030}
button.danger:hover{background:#9b2c2c}
button:disabled{opacity:0.4;cursor:not-allowed}
.status-dot{width:8px;height:8px;border-radius:50%;background:#e53e3e;display:inline-block;margin-right:6px}
.status-dot.on{background:#48bb78}
.wait-msg{font-size:13px;color:#718096;margin-top:1rem;display:flex;align-items:center;gap:6px;justify-content:center}
.spinner{width:14px;height:14px;border:2px solid #4a5568;border-top-color:#90cdf4;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* setup */
.setup-wrap{display:flex;flex-direction:column;align-items:center;gap:1rem}
.phase-title{font-size:1rem;font-weight:600;color:#90cdf4;text-align:center}
.ship-rack{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ship-btn{padding:6px 14px;font-size:13px;border-radius:8px;border:1px solid #4a5568;background:#2d3748;color:#e2e8f0;cursor:pointer}
.ship-btn:hover{background:#4a5568}
.ship-btn.sel{background:#2b6cb0;border-color:#63b3ed;color:#fff}
.ship-btn.done{opacity:0.4;cursor:default}
.dir-row{display:flex;gap:8px;justify-content:center}
.dir-btn{padding:5px 14px;font-size:12px;border-radius:6px;border:1px solid #4a5568;background:#2d3748;color:#a0aec0;cursor:pointer}
.dir-btn.active{background:#2b6cb0;border-color:#63b3ed;color:#fff}

/* board */
.board-wrap{display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.board-section{display:flex;flex-direction:column;align-items:center;gap:6px}
.board-label{font-size:12px;color:#718096;font-weight:500}
.board{display:grid;grid-template-columns:24px repeat(5,48px);grid-template-rows:24px repeat(5,48px);gap:2px}
.hdr{display:flex;align-items:center;justify-content:center;font-size:12px;color:#718096;font-weight:500}
.cell{width:48px;height:48px;border:1px solid #2d3748;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;background:#1e2535;transition:background 0.1s;position:relative}
.cell:hover{background:#2d3748}
.cell.ship{background:#2b4c7e;border-color:#63b3ed}
.cell.preview{background:#1e4068;border-color:#4299e1;opacity:0.7}
.cell.preview.bad{background:#4a1212;border-color:#e53e3e}
.cell.hit{background:#744210;border-color:#d69e2e;cursor:default}
.cell.miss{background:#2d3748;border-color:#4a5568;cursor:default}
.cell.sunk{background:#742a2a;border-color:#e53e3e;cursor:default}
.cell.cleared{background:#1c4532;border-color:#48bb78;cursor:default}
.cell.sunk::after{content:'💥';font-size:20px}
.cell.hit::after{content:'🔥';font-size:18px}
.cell.miss::after{content:'✕';font-size:16px;color:#4a5568}
.cell.cleared::after{content:'·';font-size:24px;color:#48bb78}
.cell[data-ship]:not(.hit):not(.miss):not(.sunk):not(.cleared)::after{content:attr(data-ship-icon);font-size:16px}
.no-click{pointer-events:none}

/* battle */
.turn-bar{text-align:center;padding:8px;background:#2d3748;border-radius:8px;margin-bottom:1rem}
.turn-bar .badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;background:#2b6cb0;color:#fff}
.turn-bar .badge.opp{background:#2d3748;border:1px solid #4a5568;color:#718096}
.hint-txt{font-size:13px;color:#a0aec0;margin-top:4px}
.logs{max-height:100px;overflow-y:auto;background:#1a1f2e;border:1px solid #2d3748;border-radius:6px;padding:8px;font-size:12px;color:#718096;margin-top:1rem}
.log-line{padding:2px 0;border-bottom:1px solid #2d3748}
.log-line:last-child{border:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:11px;color:#718096;margin-top:6px}
.leg{display:flex;align-items:center;gap:4px}
.leg-sq{width:12px;height:12px;border-radius:2px}

/* overlay */
.overlay{background:rgba(10,12,20,0.85);min-height:300px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin:2rem 0}
.ov-card{background:#2d3748;border-radius:12px;padding:2.5rem;text-align:center;max-width:340px}
.ov-card h2{font-size:1.5rem;margin-bottom:8px;color:#90cdf4}
.ov-card p{font-size:14px;color:#a0aec0;margin-bottom:1.5rem}

@media(max-width:600px){
  .cell{width:40px;height:40px}
  .board{grid-template-columns:22px repeat(5,40px);grid-template-rows:22px repeat(5,40px)}
}
</style>
</head>
<body>

<header>
  <h1>⚓ 海戰棋</h1>
  <div class="room-info" id="room-info">未連線</div>
</header>

<!-- Lobby -->
<div id="s-lobby" class="screen active">
  <div class="lobby-card">
    <h2>海戰棋</h2>
    <p>兩人各自佈置艦隊，輪流砲擊，先擊沉對手所有艦艇獲勝</p>
    <button onclick="joinGame()" id="btn-join" style="width:100%;margin-bottom:8px">快速加入 / 建立房間</button>
    <div class="input-row">
      <input type="text" id="room-input" placeholder="輸入房間碼" maxlength="6">
      <button class="sec" onclick="joinRoom()">加入指定房間</button>
    </div>
    <div class="wait-msg" id="wait-msg" style="display:none">
      <div class="spinner"></div>
      <span id="wait-txt">等待對手加入...</span>
    </div>
  </div>
</div>

<!-- Setup -->
<div id="s-setup" class="screen">
  <div class="setup-wrap">
    <div class="phase-title" id="setup-title">佈陣中</div>
    <div id="setup-opp-wait" style="font-size:13px;color:#718096;display:none">
      <div class="spinner" style="display:inline-block;vertical-align:middle;margin-right:6px"></div>等待對手完成佈陣...
    </div>
    <div class="dir-row">
      <button class="dir-btn active" id="dir-h" onclick="setDir('H')">橫向</button>
      <button class="dir-btn" id="dir-v" onclick="setDir('V')">縱向</button>
    </div>
    <div class="ship-rack" id="ship-rack"></div>
    <div class="board" id="setup-board"></div>
    <p style="font-size:12px;color:#718096;margin-top:4px" id="setup-hint">選擇艦艇後點擊棋盤放置，艦艇間需相隔一格</p>
    <button class="sec" onclick="resetSetup()" style="margin-top:4px;font-size:12px;padding:5px 14px">重製佈陣</button>
  </div>
</div>

<!-- Battle -->
<div id="s-battle" class="screen">
  <div class="turn-bar">
    <span class="badge" id="turn-badge">你的回合</span>
    <div class="hint-txt" id="battle-hint"></div>
  </div>
  <div class="board-wrap">
    <div class="board-section">
      <div class="board-label">對手海域（點擊攻擊）</div>
      <div class="board" id="board-attack"></div>
    </div>
    <div class="board-section">
      <div class="board-label">我的海域</div>
      <div class="board" id="board-defend"></div>
    </div>
  </div>
  <div class="legend">
    <div class="leg"><div class="leg-sq" style="background:#744210"></div>命中</div>
    <div class="leg"><div class="leg-sq" style="background:#742a2a"></div>爆破</div>
    <div class="leg"><div class="leg-sq" style="background:#1c4532"></div>清除區</div>
    <div class="leg"><div class="leg-sq" style="background:#2d3748"></div>未中</div>
  </div>
  <div class="logs" id="battle-log"></div>
</div>

<!-- Win/Lose overlay inside battle -->
<div id="s-end" class="screen">
  <div class="overlay">
    <div class="ov-card">
      <h2 id="end-title">勝利！</h2>
      <p id="end-sub">恭喜你擊沉對手所有艦艇！</p>
      <button onclick="sendMsg({type:'restart'})">再來一局</button>
    </div>
  </div>
</div>

<!-- Disconnect -->
<div id="s-dc" class="screen">
  <div class="overlay">
    <div class="ov-card">
      <h2>對手離線</h2>
      <p>對手已斷線，請重新整理頁面重新開始</p>
      <button onclick="location.reload()">重新整理</button>
    </div>
  </div>
</div>

<script>
const COLS = ['A','B','C','D','E'];
const SHIP_DEFS = [
  {id:'s3', name:'3格艦', size:3},
  {id:'s2a', name:'2格艦(1)', size:2},
  {id:'s2b', name:'2格艦(2)', size:2},
  {id:'s1', name:'1格艦', size:1},
];
const SHIP_ICONS = {s3:'🚢', s2a:'⛵', s2b:'⛵', s1:'🛶'};

let ws = null;
let myIndex = -1;
let myGrid = {};
let selShip = null;
let dir = 'H';
let hoverKey = null;

const WS_URL = location.protocol === 'https:' 
  ? `wss://${location.host}` 
  : `ws://${location.host}`;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function connect(cb) {
  if (ws && ws.readyState === 1) { cb(); return; }
  ws = new WebSocket(WS_URL);
  ws.onopen = cb;
  ws.onmessage = (e) => handleMsg(JSON.parse(e.data));
  ws.onclose = () => {
    if (document.getElementById('s-lobby').classList.contains('active')) return;
    showScreen('s-dc');
  };
}

function sendMsg(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function joinGame() {
  document.getElementById('btn-join').disabled = true;
  connect(() => sendMsg({type:'join'}));
}

function joinRoom() {
  const code = document.getElementById('room-input').value.trim().toUpperCase();
  if (!code) return;
  connect(() => sendMsg({type:'join', roomId: code}));
}

function handleMsg(msg) {
  myIndex = msg.myIndex ?? myIndex;

  if (msg.type === 'joined') {
    const ri = document.getElementById('room-info');
    ri.textContent = '房間：' + msg.roomId + '  玩家' + (myIndex+1);
    if (msg.playerCount < 2) {
      document.getElementById('wait-msg').style.display = 'flex';
      document.getElementById('wait-txt').textContent = '房間碼：' + msg.roomId + '  等待對手加入...';
    }
  }

  if (msg.type === 'ready') {
    myGrid = {};
    selShip = null;
    dir = 'H';
    buildSetupBoard();
    buildShipRack([]);
    showScreen('s-setup');
    document.getElementById('setup-title').textContent = '玩家' + (myIndex+1) + ' 佈陣';
  }

  if (msg.type === 'state') {
    if (msg.phase === 'setup') {
      myGrid = msg.myGrid;
      const placed = SHIP_DEFS.filter(d => Object.values(myGrid).includes(d.id)).map(d => d.id);
      buildShipRack(placed);
      buildSetupBoard();
      const myDone = msg.setupDone[myIndex];
      document.getElementById('setup-opp-wait').style.display = myDone ? 'flex' : 'none';
    }
    if (msg.phase === 'battle') {
      renderBattle(msg);
      showScreen('s-battle');
    }
    if (msg.phase === 'end') {
      renderBattle(msg);
    }
  }

  if (msg.type === 'battleStart') {
    showScreen('s-battle');
  }

  if (msg.type === 'result') {
    const hint = document.getElementById('battle-hint');
    if (msg.result === 'hit') hint.textContent = '命中！繼續砲擊';
    else if (msg.result === 'sunk') hint.textContent = '爆破！周圍8格清除，繼續砲擊';
    else hint.textContent = '未中，等待對手攻擊...';
  }

  if (msg.type === 'win') {
    const won = msg.winner === myIndex;
    document.getElementById('end-title').textContent = won ? '勝利！' : '落敗...';
    document.getElementById('end-sub').textContent = won
      ? '恭喜你擊沉對手所有艦艇！'
      : '對手擊沉了你所有的艦艇';
    showScreen('s-end');
  }

  if (msg.type === 'placeErr') {
    document.getElementById('setup-hint').textContent = msg.message;
  }

  if (msg.type === 'disconnect') {
    showScreen('s-dc');
  }

  if (msg.type === 'restart') {
    myGrid = {};
    selShip = null;
    dir = 'H';
    buildSetupBoard();
    buildShipRack([]);
    document.getElementById('setup-opp-wait').style.display = 'none';
    showScreen('s-setup');
  }
}

// ---- Setup Board ----
function buildShipRack(placed) {
  const rack = document.getElementById('ship-rack');
  rack.innerHTML = '';
  SHIP_DEFS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'ship-btn' + (placed.includes(s.id) ? ' done' : '');
    btn.textContent = s.name + ' (' + s.size + '格)';
    btn.disabled = placed.includes(s.id);
    if (!placed.includes(s.id)) btn.onclick = () => selectShip(s, btn);
    rack.appendChild(btn);
  });
}

function selectShip(s, btn) {
  selShip = s;
  document.querySelectorAll('.ship-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('setup-hint').textContent = '放置：' + s.name + '（' + s.size + '格）';
}

function setDir(d) {
  dir = d;
  document.getElementById('dir-h').classList.toggle('active', d === 'H');
  document.getElementById('dir-v').classList.toggle('active', d === 'V');
  if (hoverKey) buildSetupBoard(hoverKey);
}

function getPreviewCells(key) {
  if (!selShip || !key) return {cells:[], valid:false};
  const col = key[0], row = parseInt(key[1]);
  const ci = COLS.indexOf(col);
  const cells = [];
  let valid = true;
  for (let i = 0; i < selShip.size; i++) {
    let k;
    if (dir === 'H') { const nc = COLS[ci + i]; if (!nc) { valid=false; break; } k = nc + row; }
    else { const nr = row + i; if (nr > 5) { valid=false; break; } k = col + nr; }
    cells.push(k);
  }
  // check overlap & neighbors
  if (valid) {
    const nb = getNeighbors(myGrid);
    for (const k of cells) {
      if (myGrid[k] || nb.has(k)) { valid = false; break; }
    }
  }
  return {cells, valid};
}

function getNeighbors(grid) {
  const nb = new Set();
  Object.keys(grid).forEach(k => {
    const c = k[0], r = parseInt(k[1]), ci = COLS.indexOf(c);
    for (let dc=-1; dc<=1; dc++) for (let dr=-1; dr<=1; dr++) {
      if (dc===0&&dr===0) continue;
      const nc=COLS[ci+dc], nr=r+dr;
      if (nc&&nr>=1&&nr<=5) nb.add(nc+nr);
    }
  });
  return nb;
}

function buildSetupBoard(hKey) {
  const board = document.getElementById('setup-board');
  board.innerHTML = '';
  board.appendChild(Object.assign(document.createElement('div'), {className:'hdr'}));
  COLS.forEach(c => { const d=document.createElement('div');d.className='hdr';d.textContent=c;board.appendChild(d); });

  const preview = hKey ? getPreviewCells(hKey) : {cells:[], valid:false};

  COLS.forEach ? null : null;
  [1,2,3,4,5].forEach(r => {
    const rh = document.createElement('div');
    rh.className='hdr'; rh.textContent=r; board.appendChild(rh);
    COLS.forEach(c => {
      const key = c + r;
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (myGrid[key]) {
        cell.classList.add('ship');
        cell.setAttribute('data-ship-icon', SHIP_ICONS[myGrid[key]] || '');
      } else if (preview.cells.includes(key)) {
        cell.classList.add('preview');
        if (!preview.valid) cell.classList.add('bad');
      }
      cell.onmouseenter = () => { hoverKey=key; buildSetupBoard(key); };
      cell.onmouseleave = () => { hoverKey=null; buildSetupBoard(); };
      cell.onclick = () => placeShip(c, r);
      board.appendChild(cell);
    });
  });
}

function placeShip(col, row) {
  if (!selShip) { document.getElementById('setup-hint').textContent='請先選擇艦艇'; return; }
  // 先樂觀更新本地 grid，讓後續 hover 預覽正確
  const ci = COLS.indexOf(col), r = parseInt(row);
  const cells = {};
  let valid = true;
  for (let i = 0; i < selShip.size; i++) {
    let k;
    if (dir === 'H') { const nc = COLS[ci+i]; if (!nc){valid=false;break;} k=nc+r; }
    else { const nr=r+i; if(nr>5){valid=false;break;} k=col+nr; }
    cells[k]=true;
  }
  if (!valid) { document.getElementById('setup-hint').textContent='無法放置（超界）'; return; }
  const nb = getNeighbors(myGrid);
  for (const k of Object.keys(cells)) {
    if (myGrid[k] || nb.has(k)) { document.getElementById('setup-hint').textContent='無法放置（太靠近其他艦艇）'; return; }
  }
  Object.keys(cells).forEach(k => myGrid[k] = selShip.id);
  sendMsg({type:'place', shipId:selShip.id, col, row:parseInt(row), dir});
  selShip = null;
  hoverKey = null;
  document.querySelectorAll('.ship-btn').forEach(b => b.classList.remove('sel'));
  buildSetupBoard();
}

function resetSetup() {
  sendMsg({type:'resetSetup'});
  myGrid = {};
  selShip = null;
  hoverKey = null;
  buildShipRack([]);
  buildSetupBoard();
  document.getElementById('setup-hint').textContent='選擇艦艇後點擊棋盤放置，艦艇間需相隔一格';
  document.getElementById('setup-opp-wait').style.display='none';
}

// ---- Battle ----
function renderBattle(msg) {
  const isMyTurn = msg.currentTurn === myIndex;
  document.getElementById('turn-badge').textContent = isMyTurn ? '你的回合' : '對手回合';
  document.getElementById('turn-badge').className = 'badge' + (isMyTurn ? '' : ' opp');
  if (isMyTurn) document.getElementById('battle-hint').textContent = '點擊對手海域發射砲彈';

  buildBattleBoard('board-attack', msg.oppGrid, msg.myAttackOnOpp, isMyTurn, false);
  buildBattleBoard('board-defend', msg.myGrid, msg.oppAttackOnMe, false, true);

  if (msg.logs) {
    document.getElementById('battle-log').innerHTML =
      msg.logs.map(l => '<div class="log-line">' + l + '</div>').join('');
  }
}

function buildBattleBoard(containerId, shipGrid, attackMap, clickable, showShips) {
  const board = document.getElementById(containerId);
  board.innerHTML = '';
  board.appendChild(Object.assign(document.createElement('div'), {className:'hdr'}));
  COLS.forEach(c => { const d=document.createElement('div');d.className='hdr';d.textContent=c;board.appendChild(d); });
  [1,2,3,4,5].forEach(r => {
    const rh=document.createElement('div');rh.className='hdr';rh.textContent=r;board.appendChild(rh);
    COLS.forEach(c => {
      const key = c + r;
      const cell = document.createElement('div');
      cell.className = 'cell';
      const atk = attackMap ? attackMap[key] : null;
      if (atk === 'sunk') cell.classList.add('sunk');
      else if (atk === 'hit') cell.classList.add('hit');
      else if (atk === 'miss') cell.classList.add('miss');
      else if (atk === 'cleared') cell.classList.add('cleared');
      else if (showShips && shipGrid && shipGrid[key]) {
        cell.classList.add('ship');
        cell.setAttribute('data-ship-icon', SHIP_ICONS[shipGrid[key]] || '');
      }
      if (clickable && !atk) {
        cell.onclick = () => sendMsg({type:'fire', key});
      } else {
        cell.classList.add('no-click');
      }
      board.appendChild(cell);
    });
  });
}

buildSetupBoard();
</script>
</body>
</html>
